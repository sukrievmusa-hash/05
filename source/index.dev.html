<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hinoki SPA — Астана · онлайн-запись и CRM</title>
<meta name="description" content="Hinoki SPA, Астана: хаммам, SPA-программы, тайский массаж. Онлайн-запись с проверкой свободного времени.">
<meta name="theme-color" content="#F7F4EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" crossorigin></script>
<style>
:root{
  --bg:#F7F4EF; --bg2:#EFE9DF; --card:#FFFDF9; --olive:#5C6B57; --olive-d:#48553F; --olive-l:#E3E8DD;
  --wood:#2C2520; --wood-2:#5A4E45; --muted:#8A7F75; --gold:#C5A880; --gold-l:#F1E7D7; --line:#E4DCCF;
  --red:#B5523B; --red-l:#F8E4DD; --blue:#4F6D8A; --blue-l:#E2EAF1; --amber:#B8862F; --amber-l:#F6ECD6;
  --r:18px; --sh:0 1px 2px rgba(44,37,32,.05),0 8px 28px rgba(44,37,32,.07);
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--wood);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.boot{min-height:100vh;display:grid;place-items:center;font-family:var(--serif);font-size:28px;color:var(--olive)}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(247,244,239,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo b{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.02em}
.logo small{display:block;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:-4px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{text-decoration:none;font-size:14px;color:var(--wood-2);padding:8px 12px;border-radius:99px}
.nav a:hover{background:var(--bg2)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--bg2);border-radius:99px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--wood-2);white-space:nowrap;position:relative}
.seg button.on{background:var(--card);color:var(--wood);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.dark button.on{background:var(--wood);color:#fff}
.dot-badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 22px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s, background .2s, box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:var(--wood)}
.btn.gold:hover{background:#B99A70}
.btn.olive{background:var(--olive);color:#fff}
.btn.olive:hover{background:var(--olive-d)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--wood)}
.btn.ghost:hover{background:var(--bg2)}
.btn.wa{background:#25D366;color:#073B1F}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{padding:40px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);font-weight:600}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:1.02;margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--olive)}
.hero p.lead{font-size:17px;color:var(--wood-2);max-width:520px;margin:0 0 26px}
.rating{display:inline-flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px 8px 8px;margin-bottom:26px}
.rating .g{width:34px;height:34px;border-radius:50%;background:#19AA1E;color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.rating b{font-size:18px}
.stars{color:var(--gold);letter-spacing:2px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-facts{display:flex;gap:24px;margin-top:30px;flex-wrap:wrap;color:var(--wood-2);font-size:14px}
.hero-facts div b{display:block;font-family:var(--serif);font-size:26px;color:var(--wood)}
.art{position:relative;aspect-ratio:4/5;border-radius:200px 200px 24px 24px;overflow:hidden;background:linear-gradient(160deg,#D9C7A8,#B79B73 55%,#8E7553);box-shadow:var(--sh)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,37,32,0) 55%,rgba(44,37,32,.35));pointer-events:none}
.art .tag{z-index:1}
.art .tag{position:absolute;left:18px;bottom:18px;right:18px;background:rgba(255,253,249,.92);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(8px)}
.art .tag .ic{width:40px;height:40px;border-radius:12px;background:var(--olive-l);display:grid;place-items:center;font-size:20px}

/* promo */
.promo{padding:18px 0 0}
.promo-card{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(120deg,#2C2520 0%,#3E322A 55%,#5A4535 100%);color:#F7F4EF;padding:22px 26px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;box-shadow:0 14px 40px rgba(44,37,32,.22)}
.promo-card::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(197,168,128,.35)}
.promo-badge{background:var(--gold);color:var(--wood);border-radius:18px;padding:12px 14px;text-align:center;line-height:1}
.promo-badge b{display:block;font-family:var(--serif);font-size:36px}
.promo-badge small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.promo-card h3{font-size:clamp(24px,3vw,32px);color:#fff}
.promo-card p{margin:4px 0 0;color:#D9CFC2;font-size:14px}
.promo-price{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap}
.promo-price b{font-family:var(--serif);font-size:30px;color:var(--gold)}
.promo-price s{color:#A99C8E}
.promo-card .btn{position:relative;z-index:1}
.sv.is-promo{border:1.5px solid var(--gold);box-shadow:0 0 0 4px var(--gold-l)}
@media (max-width:620px){.promo-card{grid-template-columns:auto 1fr;padding:18px;gap:14px}.promo-card .btn{grid-column:1/-1;width:100%}.promo-badge b{font-size:28px}}

/* sections */
section.s{padding:64px 0}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.s-head h2{font-size:clamp(32px,4vw,46px);line-height:1.05}
.s-head p{margin:8px 0 0;color:var(--wood-2);max-width:520px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;color:var(--wood-2)}
.chip.on{background:var(--wood);border-color:var(--wood);color:#fff}

.grid-sv{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s, transform .2s;position:relative}
.sv:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.sv h3{font-size:27px;line-height:1.1}
.sv .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg2);color:var(--wood-2)}
.pill.gold{background:var(--gold-l);color:#8A6A3D}
.pill.olive{background:var(--olive-l);color:var(--olive-d)}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.amber{background:var(--amber-l);color:#8C6218}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--wood-2)}
.steps li i{font-style:normal;width:26px;height:26px;flex-shrink:0;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:14px}
.prices{display:flex;gap:10px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.prices div{flex:1}
.prices small{display:block;font-size:12px;color:var(--muted)}
.prices b{font-size:19px;font-weight:700}
.prices s{color:var(--muted);font-size:13px;margin-left:4px}
.flow{display:flex;height:8px;border-radius:6px;overflow:hidden;gap:2px}
.flow span{display:block;height:100%}
.more{background:none;border:0;padding:0;color:var(--olive);font-weight:600;font-size:13px;text-align:left}
.phase-list{font-size:13px;color:var(--wood-2);display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:12px;padding:10px 12px}
.phase-list div{display:flex;justify-content:space-between;gap:8px}

/* booking widget */
.bk{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.bk>*,.gift>*,.contacts>*,.hero .wrap>*{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--sh)}
.stepper{display:flex;gap:6px;margin-bottom:22px}
.stepper div{flex:1}
.stepper .bar{height:4px;border-radius:4px;background:var(--line)}
.stepper .on .bar{background:var(--olive)}
.stepper small{display:block;font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
.stepper .on small{color:var(--wood)}
.lbl{font-size:13px;font-weight:600;color:var(--wood-2);margin:18px 0 8px;display:block}
.lbl:first-child{margin-top:0}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--olive);background:var(--olive-l)}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:12.5px}
.opt.dis{opacity:.4;pointer-events:none}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:0 0 64px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 4px;text-align:center}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day b{font-size:20px;font-family:var(--serif)}
.day.on{border-color:var(--olive);background:var(--olive);color:#fff}
.day.on small{color:#E8EDE4}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){border-color:var(--olive)}
.slot.on{background:var(--olive);border-color:var(--olive);color:#fff}
.slot:disabled{background:repeating-linear-gradient(135deg,var(--bg2),var(--bg2) 5px,var(--bg) 5px,var(--bg) 10px);color:#B9AFA4;text-decoration:line-through;cursor:not-allowed}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--olive);background:#fff}
textarea.inp{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-btns{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.summary h3{font-size:24px;margin-bottom:14px}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-row span{color:var(--muted)}
.sum-row b{text-align:right;font-weight:600}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.sum-total b{font-family:var(--serif);font-size:32px}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;display:flex;gap:8px}
.success{text-align:center;padding:10px 0}
.success .ok{width:72px;height:72px;border-radius:50%;background:var(--olive-l);color:var(--olive);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.success h3{font-size:34px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);padding:3px 8px;border-radius:6px;font-size:14px}
.err{color:var(--red);font-size:13px;margin-top:6px}

/* gift */
.gift{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.cert{aspect-ratio:1.6/1;border-radius:22px;padding:26px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 50px rgba(44,37,32,.18)}
.cert.t-wood{background:linear-gradient(135deg,#3A2F28,#2C2520 60%,#1F1916);color:#F1E7D7}
.cert.t-sage{background:linear-gradient(135deg,#6C7B66,#5C6B57 60%,#46523F);color:#fff}
.cert.t-sand{background:linear-gradient(135deg,#F7F0E4,#EADCC4);color:var(--wood);border:1px solid var(--line)}
.cert svg.bgart{position:absolute;right:-30px;top:-30px;width:60%;opacity:.16}
.cert .c-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.cert .c-top b{font-family:var(--serif);font-size:26px;letter-spacing:.04em}
.cert .c-top small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;display:block}
.cert .c-val{font-family:var(--serif);font-size:clamp(30px,5vw,46px);line-height:1;position:relative}
.cert .c-val small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.cert .c-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px;position:relative}
.cert .c-msg{font-family:var(--serif);font-style:italic;font-size:16px;opacity:.9;max-width:70%}
.themes{display:flex;gap:10px}
.themes button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.themes button.on{border-color:var(--gold)}

/* contacts */
.contacts{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
.c-list{display:flex;flex-direction:column;gap:12px}
.c-item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.c-item .ic{width:42px;height:42px;border-radius:12px;background:var(--olive-l);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.c-item b{display:block}
.c-item span{color:var(--wood-2);font-size:14px}
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:380px;background:var(--bg2);position:relative}
.map iframe{border:0;width:100%;height:100%;position:absolute;inset:0}
footer{padding:36px 0 110px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fab{position:fixed;left:16px;right:16px;bottom:14px;z-index:30;display:none}
.fab .btn{width:100%;box-shadow:0 10px 30px rgba(44,37,32,.25)}

/* CRM */
.crm{padding:22px 0 60px}
.crm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.crm-bar h2{font-size:32px;margin-right:auto}
.datenav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.datenav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:16px}
.datenav button:hover{background:var(--bg2)}
.datenav span{padding:0 8px;font-weight:600;font-size:14px;min-width:132px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.kpi small{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--wood-2)}
.loadbars{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.loadbars div{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--wood-2)}
.loadbars .tr{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.loadbars b{font-family:var(--sans);font-size:12px;display:inline;margin:0;line-height:1.2;font-weight:600}
.loadbars .tr i{display:block;height:100%;background:var(--olive);border-radius:4px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;border:1px solid}
.alert.red{background:var(--red-l);border-color:#EDC3B6;color:#7E3524}
.alert.amber{background:var(--amber-l);border-color:#EAD4A6;color:#6E4C12}
.alert.ok{background:var(--olive-l);border-color:#CBD5C2;color:var(--olive-d)}
.alert b{font-weight:700}
.alert .ic{font-size:18px;line-height:1.2}
.tl-wrap{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tl-scroll{overflow:auto;max-height:76vh;position:relative}
.tl{display:grid;position:relative;min-width:max-content}
.tl-head{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px;font-weight:700;line-height:1.2}
.tl-head small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tl-head .ld{height:3px;background:var(--bg2);border-radius:3px;margin-top:6px;overflow:hidden}
.tl-head .ld i{display:block;height:100%;background:var(--gold)}
.tl-corner{position:sticky;left:0;z-index:7}
.tl-hours{position:sticky;left:0;z-index:5;background:var(--card);border-right:1px solid var(--line)}
.tl-hours div{position:absolute;right:8px;font-size:11.5px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tl-col{position:relative;border-right:1px solid var(--line)}
.tl-col.tea{background:repeating-linear-gradient(90deg,rgba(197,168,128,.05),rgba(197,168,128,.05) 2px,transparent 2px,transparent 8px)}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid #EFE8DD}
.tl-line.half{border-top:1px dashed #F3EEE6}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}

const addDays = (key, n) => { const [y, m, d] = key.split('-').map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return dkey(x); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const DOW = { ru: ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'], kz: ['Жс', 'Дс', 'Сс', 'Ср', 'Бс', 'Жм', 'Сб'] };

const dateObj = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };

const phoneDigits = s => { let d = (s || '').replace(/\D/g, ''); if (d.startsWith('8')) d = '7' + d.slice(1); if (d && !d.startsWith('7')) d = '7' + d; return d.slice(0, 11); };
const phoneFmt = s => { const d = phoneDigits(s); if (!d) return ''; let r = '+7'; if (d.length > 1) r += ' (' + d.slice(1, 4); if (d.length >= 4) r += ')'; if (d.length > 4) r += ' ' + d.slice(4, 7); if (d.length > 7) r += '-' + d.slice(7, 9); if (d.length > 9) r += '-' + d.slice(9, 11); return r; };

const activeOn = (bookings, date, ignoreId) => bookings.filter(b => b.date === date && b.status !== 'cancel' && b.id !== ignoreId);
const isBusy = (list, res, a, z) => list.some(b => b.segs.some(s => s.res === res && s.from < z && s.to > a));
const teaLoad = (list, a, z) => list.filter(b => b.segs.some(s => s.res === 'tea' && s.from < z && s.to > a)).length;

/** Подбирает ресурсы под запись. force=true — ручной режим администратора (разрешает накладки). */
function allocate({ svcId, dur, guests, start, pref }, bookings, date, { force = false, ignoreId } = {}) {
  const svc = SVC[svcId]; if (!svc) return null;
  const phases = phasesOf(svc, dur);
  const end = start + phases[phases.length - 1][2];
  if (!force && (start < OPEN || end > CLOSE)) return null;
  const list = activeOn(bookings, date, ignoreId);
  const segs = [];
  for (const [kind, f, t] of phases) {
    const a = start + f, z = start + t;
    if (kind === 'hammam') {
      const h = ['h1', 'h2'].find(r => !isBusy(list, r, a, z));
      if (!h && !force) return null;
      segs.push({ res: h || 'h1', from: a, to: z, kind });
    } else if (kind === 'care') {
      if (isBusy(list, 'aigerim', a, z) && !force) return null;
      segs.push({ res: 'aigerim', from: a, to: z, kind });
    } else if (kind === 'massage') {
      const order = pref === 'thai' ? (guests === 2 ? ['mali', 'noy'] : ['mali', 'noy'])
        : pref === 'local' ? ['aigerim', 'mali', 'noy'] : ['mali', 'noy', 'aigerim'];
      let picked = order.filter(r => !isBusy(list, r, a, z) && !segs.some(s => s.res === r && s.from < z && s.to > a)).slice(0, guests);
      if (pref === 'local' && guests === 1 && picked[0] !== 'aigerim') picked = [];
      if (picked.length < guests) { if (!force) return null; picked = order.slice(0, guests); }
      picked.forEach(r => segs.push({ res: r, from: a, to: z, kind }));
    } else if (kind === 'tea') {
      if (teaLoad(list, a, z) >= 2 && !force) return null;
      segs.push({ res: 'tea', from: a, to: z, kind });
    }
  }
  return segs;
}

/** Слоты для клиентского виджета */
function slotsFor(form, bookings, date) {
  const out = [];
  const isToday = date === todayKey();
  const nm = nowMin();
  for (let m = OPEN; m <= LAST_SLOT; m += 30) {
    let state = 'free';
    if (isToday && m < nm + 20) state = 'past';
    else {
      const svc = SVC[form.svcId];
      const total = phasesOf(svc, form.dur).slice(-1)[0][2];
      if (m + total > CLOSE) state = 'late';
      else if (!allocate({ ...form, start: m }, bookings, date)) state = 'busy';
    }
    out.push({ m, state });
  }
  return out;
}

/** Алерты: узкие места и накладки */
function computeAlerts(bookings, date) {
  const list = activeOn(bookings, date);
  const alerts = [];
  const zones = [['tea', 'чайной комнате', 'tea'], ['hammam', 'зоне хаммама', 'hammam']];
  for (const [kind, label] of zones) {
    let runStart = null, maxN = 0, who = new Set();
    const flush = (t) => { if (runStart !== null) { alerts.push({ type: 'red', key: kind + runStart, text: <span><b>{maxN} пары одновременно в {label}</b> с {fmt(runStart)} до {fmt(t)} — {[...who].join(', ')}. Предложите гостям сдвиг или разведите по времени.</span> }); runStart = null; maxN = 0; who = new Set(); } };
    for (let t = OPEN; t < CLOSE; t += 5) {
      const here = list.filter(b => b.segs.some(s => s.kind === kind && s.from <= t && s.to > t));
      if (here.length > 2) { if (runStart === null) runStart = t; maxN = Math.max(maxN, here.length); here.forEach(b => who.add(b.name)); }
      else flush(t);
    }
    flush(CLOSE);
  }
  // накладки по ресурсам
  for (const r of RESOURCES.filter(r => r.kind !== 'tea')) {
    const segs = list.flatMap(b => b.segs.filter(s => s.res === r.id).map(s => ({ ...s, b })));
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
      const A = segs[i], B = segs[j];
      if (A.b.id !== B.b.id && A.from < B.to && B.from < A.to) alerts.push({ type: 'red', key: r.id + A.b.id + B.b.id, ids: [A.b.id, B.b.id], text: <span><b>Накладка: {r.name}</b> — {A.b.name} и {B.b.name} пересекаются {fmt(Math.max(A.from, B.from))}–{fmt(Math.min(A.to, B.to))}.</span> });
    }
  }
  // предупреждение о высокой загрузке чайной
  for (let t = OPEN; t < CLOSE; t += 30) {
    const n = list.filter(b => b.segs.some(s => s.kind === 'tea' && s.from < t + 30 && s.to > t)).length;
    if (n === 2 && !alerts.some(a => a.type === 'amber')) alerts.push({ type: 'amber', key: 'tea2' + t, text: <span>Чайная комната заполнена на 100% около <b>{fmt(t)}</b> — новые записи на это время сайт уже не принимает.</span> });
  }
  return alerts;
}
const conflictIds = (bookings, date) => {
  const list = activeOn(bookings, date); const ids = new Set();
  for (const r of RESOURCES.filter(r => r.kind !== 'tea')) {
    const segs = list.flatMap(b => b.segs.filter(s => s.res === r.id).map(s => ({ ...s, id: b.id })));
    segs.forEach((A, i) => segs.slice(i + 1).forEach(B => { if (A.id !== B.id && A.from < B.to && B.from < A.to) { ids.add(A.id); ids.add(B.id); } }));
  }
  return ids;
};

        {s.promo && <span className="pill red">{t.promo}</span>}
      </div>
      <h3>{s.name[lang]}</h3>
      <p style={{ margin: 0, color: 'var(--wood-2)', fontSize: 14 }}>{s.d[lang]}</p>
      {isProg && <Flow svc={s} />}
      <ul className="steps">
        {s.steps.map(st => <li key={st}><i>{STEP[st].i}</i>{STEP[st][lang]}</li>)}
      </ul>
      {isProg && <button className="more" onClick={() => setOpen(!open)}>{open ? t.hide : t.details} {open ? '↑' : '↓'}</button>}
      {open && isProg && (
        <div className="phase-list">
          {s.phases.map(([k, f, to], i) => <div key={i}><span><span className="st-dot" style={{ background: PHASE[k].c }} />{PHASE[k][lang]}</span><b>{to - f} {t.min}</b></div>)}
        </div>
      )}
      <div className="prices">
        {isProg ? <>
          <div style={{ opacity: filter === 'two' ? .5 : 1 }}><small>{t.for1}</small><b>{money(s.p1)}</b></div>
          <div><small>{t.for2}</small><b>{money(s.p2)}</b>{s.old2 && <s>{money(s.old2)}</s>}</div>
        </> : <>
          <div><small>60 {t.min}</small><b>{money(s.prices[60])}</b></div>
          <div><small>90 {t.min}</small><b>{money(s.prices[90])}</b></div>
        </>}
      </div>
      <button className="btn olive sm" onClick={() => onBook(s.id, filter === 'two' ? 2 : null)}>{t.choose} →</button>
    </article>
  );
}

/* ================= ВИДЖЕТ ЗАПИСИ ================= */
const EMPTY_FORM = { guests: 1, svcId: 'tynys', dur: 60, date: null, time: null, pref: 'thai', intensity: 'medium', comment: '', name: '', phone: '' };

function BookingWidget({ lang, t, preset }) {
  const [step, setStep] = useState(1);
  const [busyMap, setBusyMap] = useState({});
  const [sending, setSending] = useState(false);
  const [f, setF] = useState({ ...EMPTY_FORM, date: todayKey() });
  const [done, setDone] = useState(null);
  const [err, setErr] = useState('');
  const set = patch => { setErr(''); setF(p => ({ ...p, ...patch })); };

  useEffect(() => {
    if (preset) { setDone(null); setStep(1); setF(p => ({ ...p, svcId: preset.svcId, guests: preset.guests || p.guests, time: null })); }
  }, [preset]);

  // занятые интервалы с сервера (без имён и телефонов)
  const fetchBusy = useCallback(async d => {
    const { data, error } = await sb.rpc('get_busy', { p_date: d });
    setBusyMap(m => ({ ...m, [d]: error ? 'error' : (data || []).map((segs, i) => ({ id: 'x' + i, date: d, status: 'wait', segs })) }));
  }, []);
  useEffect(() => { fetchBusy(f.date); const i = setInterval(() => fetchBusy(f.date), 30000); return () => clearInterval(i); }, [f.date]);
  const busyState = busyMap[f.date];
  const ready = Array.isArray(busyState);
  const bookings = ready ? busyState : [];

  const svc = SVC[f.svcId];
  const days = useMemo(() => Array.from({ length: 14 }, (_, i) => addDays(todayKey(), i)), []);
  const slots = useMemo(() => ready ? slotsFor(f, bookings, f.date) : [], [f.svcId, f.dur, f.guests, f.pref, f.date, busyState]);
  const freeCount = slots.filter(s => s.state === 'free').length;
  // если выбранный слот стал недоступен — сбрасываем
  useEffect(() => { if (ready && f.time != null && !slots.find(s => s.m === f.time && s.state === 'free')) set({ time: null }); }, [slots]);

  const price = priceOf(svc, f.dur, f.guests);
  const total = phasesOf(svc, f.dur).slice(-1)[0][2];
  const valid = { 1: !!svc, 2: f.time != null, 3: true, 4: f.name.trim().length > 1 && phoneDigits(f.phone).length === 11 };

  const submit = async () => {
    if (f.name.trim().length < 2) return setErr(t.name_err);
    if (phoneDigits(f.phone).length !== 11) return setErr(t.phone_err);
    const segs = allocate({ ...f, start: f.time }, bookings, f.date);
    if (!segs) { setStep(2); set({ time: null }); return setErr(t.slot_taken); }
    const payload = { date: f.date, start: f.time, dur: f.dur, svc: f.svcId, guests: f.guests, pref: f.pref, intensity: f.intensity, comment: f.comment.trim(), name: f.name.trim(), phone: phoneDigits(f.phone), segs };
    setSending(true);
    const { data, error } = await sb.rpc('create_booking', { p: payload });
    setSending(false);
    if (error) {
      const m = error.message || '';
      if (m.includes('slot_taken')) { fetchBusy(f.date); setStep(2); set({ time: null }); return setErr(t.slot_taken); }
      if (m.includes('too_many')) return setErr(lang === 'kz' ? 'Бұл нөмірден өтінім тым көп. WhatsApp-қа жазыңыз.' : 'Слишком много заявок с этого номера. Напишите нам в WhatsApp.');
      return setErr((lang === 'kz' ? 'Байланыс қатесі, қайталап көріңіз: ' : 'Ошибка связи с сервером, попробуйте ещё раз: ') + m);
    }
    fetchBusy(f.date);
    setDone({ ...payload, id: data, price, status: 'wait' });
  };

  const masterNames = b => [...new Set(b.segs.filter(s => s.kind === 'massage').map(s => RESOURCES.find(r => r.id === s.res).name.replace('Мастер ', '')))].join(', ');
  const waText = b => [
    lang === 'kz' ? 'Сәлеметсіз бе! Hinoki SPA сайты арқылы жазылдым.' : 'Здравствуйте! Я записался(-ась) в Hinoki SPA через сайт.',
    `${t.booking_no}: ${bookingCode(b.id)}`,
    `${t.service}: ${svcName(b.svc, lang)}${SVC[b.svc].cat === 'massage' ? ` (${b.dur} ${t.min})` : ''}`,
    `${t.date}: ${dateLabel(b.date, lang)}, ${fmt(b.start)}`,
    `${t.guests}: ${b.guests}`,
    `${t.master}: ${PREFS[b.pref][lang]} (${masterNames(b)})`,
    `${t.intensity}: ${INTENS[b.intensity][lang]}`,
    b.comment ? `${t.health}: ${b.comment}` : null,
    `${t.name}: ${b.name}, ${phoneFmt(b.phone)}`,
    `${t.total}: ${money(b.price)}`,
  ].filter(Boolean).join('\n');

  const reset = () => { setDone(null); setStep(1); setF({ ...EMPTY_FORM, date: todayKey() }); };
  const dayLbl = (k, i) => i === 0 ? t.today : i === 1 ? t.tomorrow : DOW[lang][dateObj(k).getDay()];
  const filteredSvcs = SERVICES;

  return (
    <div className="bk">
      <div className="panel">
        {done ? (
          <div className="success">
            <div className="ok">✓</div>
            <h3>{t.done_title}</h3>
            <p style={{ color: 'var(--wood-2)', maxWidth: 440, margin: '10px auto 18px' }}>{t.done_text}</p>
            <p>{t.booking_no}: <span className="code">{bookingCode(done.id)}</span></p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 380, margin: '20px auto 0' }}>
              <a className="btn wa" href={waLink(waText(done))} target="_blank" rel="noopener">💬 {t.send_wa}</a>
              <button className="btn ghost" onClick={reset}>{t.new_booking}</button>
            </div>
          </div>
        ) : <>
          <div className="stepper">
            {[t.s1, t.s2, t.s3, t.s4].map((s, i) => <div key={i} className={step >= i + 1 ? 'on' : ''}><div className="bar" /><small>{i + 1}. {s}</small></div>)}
          </div>

          {step === 1 && <div>
            <span className="lbl">{t.format}</span>
            <div className="opt-grid">
              <button className={'opt' + (f.guests === 1 ? ' on' : '')} onClick={() => set({ guests: 1, time: null })}><b>🧘 {t.for1}</b><small>1 {lang === 'kz' ? 'қонақ' : 'гость'}</small></button>
              <button className={'opt' + (f.guests === 2 ? ' on' : '')} onClick={() => set({ guests: 2, time: null })}><b>👫 {t.for2}</b><small>{lang === 'kz' ? 'Жұпқа арналған баға' : 'Специальная цена для пары'}</small></button>
            </div>
            <span className="lbl">{t.service}</span>
            <div className="opt-grid">
              {filteredSvcs.map(s => (
                <button key={s.id} className={'opt' + (f.svcId === s.id ? ' on' : '')} onClick={() => set({ svcId: s.id, time: null })}>
                  <b>{s.name[lang]}</b>
                  <small>{s.cat === 'program' ? `${s.dur} ${t.min} · ${money(f.guests === 2 ? s.p2 : s.p1)}` : `60/90 ${t.min} · ${lang === 'kz' ? 'бастап' : 'от'} ${money(s.prices[60] * f.guests)}`}</small>
                </button>
              ))}
            </div>
            {svc.cat === 'massage' && <>
              <span className="lbl">{t.duration}</span>
              <div className="opt-grid">
                {[60, 90].map(d => <button key={d} className={'opt' + (f.dur === d ? ' on' : '')} onClick={() => set({ dur: d, time: null })}><b>{d} {t.min}</b><small>{money(svc.prices[d] * f.guests)}</small></button>)}
              </div>
            </>}
          </div>}

          {step === 2 && <div>
            <span className="lbl">{t.date}</span>
            <div className="days">
              {days.map((k, i) => <button key={k} className={'day' + (f.date === k ? ' on' : '')} onClick={() => set({ date: k, time: null })}><small>{dayLbl(k, i)}</small><b>{dateObj(k).getDate()}</b></button>)}
            </div>
            <span className="lbl">{t.time} · {dateLabel(f.date, lang)} · <span style={{ color: 'var(--olive)' }}>{t.free}: {freeCount}</span></span>
            <div className="slots">
              {slots.map(s => <button key={s.m} className={'slot' + (f.time === s.m ? ' on' : '')} disabled={s.state !== 'free'} title={s.state === 'late' ? t.soon_close : s.state === 'busy' ? t.busy : ''} onClick={() => set({ time: s.m })}>{fmt(s.m)}</button>)}
            </div>
            {!busyState && <p className="note">⏳ {lang === 'kz' ? 'Кесте жүктелуде…' : 'Загружаем свободное время…'}</p>}
            {busyState === 'error' && <p className="err">{lang === 'kz' ? 'Кестені жүктеу мүмкін болмады. WhatsApp арқылы жазылыңыз.' : 'Не удалось загрузить расписание. Запишитесь через WhatsApp: '}<a href={waLink('Здравствуйте! Хочу записаться в Hinoki SPA.')} target="_blank" rel="noopener">{PHONE_VIEW}</a></p>}
            {ready && freeCount === 0 && <p className="err">{t.no_slots}</p>}
            <div className="legend"><span><i /> {t.free}</span><span><i style={{ background: 'repeating-linear-gradient(135deg,#EFE9DF,#EFE9DF 3px,#F7F4EF 3px,#F7F4EF 6px)' }} /> {t.busy}</span><span><i style={{ background: 'var(--olive)', borderColor: 'var(--olive)' }} /> {t.chosen}</span></div>
          </div>}

          {step === 3 && <div>
            <span className="lbl">{t.master}</span>
            <div className="opt-grid" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))' }}>
              {Object.entries(PREFS).map(([k, p]) => <button key={k} className={'opt' + (f.pref === k ? ' on' : '')} onClick={() => set({ pref: k, time: f.time })}><b>{p[lang]}</b><small>{p.s[lang]}</small></button>)}
            </div>
            {f.time != null && !allocate({ ...f, start: f.time }, bookings, f.date) && <p className="err">{lang === 'kz' ? 'Бұл уақытта таңдалған шебер бос емес — басқа шеберді немесе уақытты таңдаңыз.' : 'На это время выбранный мастер занят — выберите другого мастера или вернитесь к выбору времени.'}</p>}
            <span className="lbl">{t.intensity}</span>
            <div className="opt-grid" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))' }}>
              {Object.entries(INTENS).map(([k, p]) => <button key={k} className={'opt' + (f.intensity === k ? ' on' : '')} onClick={() => set({ intensity: k })}><b>{k === 'soft' ? '🌸' : k === 'medium' ? '🌿' : '🪵'} {p[lang]}</b></button>)}
            </div>
            <span className="lbl">{t.health}</span>
            <textarea className="inp" value={f.comment} onChange={e => set({ comment: e.target.value })} placeholder={t.health_ph} maxLength={400} />
          </div>}

          {step === 4 && <div>
            <div className="row2">
              <div><span className="lbl">{t.name}</span><input className="inp" value={f.name} onChange={e => set({ name: e.target.value })} placeholder={t.name_ph} autoComplete="name" /></div>
              <div><span className="lbl">{t.phone}</span><input className="inp" value={f.phone} onChange={e => set({ phone: phoneFmt(e.target.value) })} placeholder="+7 (7__) ___-__-__" inputMode="tel" autoComplete="tel" /></div>
            </div>
            <div className="note">🔒 <span>{lang === 'kz' ? 'Нөміріңіз тек растау және еске салу үшін қолданылады.' : 'Номер нужен только для подтверждения и напоминания о визите.'}</span></div>
          </div>}

          {err && <p className="err">{err}</p>}
          <div className="nav-btns">
            {step > 1 ? <button className="btn ghost" onClick={() => setStep(step - 1)}>← {t.back}</button> : <span />}
            {step < 4 && <button className="btn olive" disabled={!valid[step] || (step === 3 && !allocate({ ...f, start: f.time }, bookings, f.date))} onClick={() => setStep(step + 1)}>{t.next} →</button>}
            {step === 4 && <button className="btn gold" disabled={!valid[4] || sending} onClick={submit}>{sending ? '⏳ …' : t.confirm}</button>}
          </div>
        </>}
      </div>

      <aside className="panel summary">
        <h3>{t.summary}</h3>
        <div className="sum-row"><span>{t.service}</span><b>{svc.name[lang]}</b></div>
        <div className="sum-row"><span>{t.duration}</span><b>{total} {t.min}</b></div>
        <div className="sum-row"><span>{t.guests}</span><b>{f.guests}</b></div>
        <div className="sum-row"><span>{t.date}</span><b>{f.time != null ? `${dateLabel(f.date, lang)}, ${fmt(f.time)}–${fmt(f.time + total)}` : t.not_chosen}</b></div>
        {step >= 3 && <div className="sum-row"><span>{t.master}</span><b>{PREFS[f.pref][lang]}</b></div>}
        {step >= 3 && <div className="sum-row"><span>{t.intensity}</span><b>{INTENS[f.intensity][lang]}</b></div>}
        <div style={{ marginTop: 14 }}><Flow svc={svc} dur={f.dur} /></div>
        <div className="sum-total"><span>{t.total}</span><b>{money(price)}</b></div>
        <div className="note">💳 <span>{t.pay_note}</span></div>
      </aside>
    </div>
  );
}

  const set = p => setG(x => ({ ...x, ...p }));

  const value = g.type === 'amount' ? (Number(g.custom) || g.amount) : priceOf(prog, 60, g.guests);

  const text = [
    lang === 'kz' ? 'Сәлеметсіз бе! Сыйлық сертификатын рәсімдегім келеді.' : 'Здравствуйте! Хочу оформить подарочный сертификат Hinoki SPA.',
    g.type === 'amount' ? `${t.g_amount}: ${money(value)}` : `${t.g_program}: ${prog.name[lang]} (${g.guests === 2 ? t.for2 : t.for1}) — ${money(value)}`,
    g.to && `${t.g_to}: ${g.to}`, g.from && `${t.g_from}: ${g.from}`, g.msg && `${t.g_msg}: ${g.msg}`,

  ].filter(Boolean).join('\n');

          <span className="lbl">{t.g_amount}</span>
          <div className="chips">
            {[15000, 25000, 30000, 50000, 75000, 100000].map(a => <button key={a} className={'chip' + (!g.custom && g.amount === a ? ' on' : '')} onClick={() => set({ amount: a, custom: '' })}>{money(a)}</button>)}
          </div>
          <span className="lbl">{t.g_custom}</span>
          <input className="inp" inputMode="numeric" placeholder="40 000" value={g.custom} onChange={e => set({ custom: e.target.value.replace(/\D/g, '').slice(0, 7) })} />
        </> : <>
          <span className="lbl">{t.g_program}</span>
          <select className="inp" value={g.program} onChange={e => set({ program: e.target.value })}>
            {SERVICES.filter(s => s.cat === 'program').map(s => <option key={s.id} value={s.id}>{s.name[lang]} · {s.dur} {t.min}</option>)}
          </select>
          <span className="lbl">{t.format}</span>
          <div className="opt-grid">
            <button className={'opt' + (g.guests === 1 ? ' on' : '')} onClick={() => set({ guests: 1 })}><b>{t.for1}</b><small>{money(prog.p1)}</small></button>
            <button className={'opt' + (g.guests === 2 ? ' on' : '')} onClick={() => set({ guests: 2 })}><b>{t.for2}</b><small>{money(prog.p2)}</small></button>
          </div>
        </>}
        <div className="row2">
          <div><span className="lbl">{t.g_to}</span><input className="inp" value={g.to} maxLength={30} onChange={e => set({ to: e.target.value })} placeholder={t.g_to_ph} /></div>
          <div><span className="lbl">{t.g_from}</span><input className="inp" value={g.from} maxLength={30} onChange={e => set({ from: e.target.value })} placeholder={t.g_from_ph} /></div>
        </div>
        <span className="lbl">{t.g_msg}</span>
        <input className="inp" value={g.msg} maxLength={70} onChange={e => set({ msg: e.target.value })} placeholder={t.g_msg_ph} />
        <span className="lbl">{t.g_theme}</span>
        <div className="themes">{Object.entries(themes).map(([k, bg]) => <button key={k} aria-label={k} className={g.theme === k ? 'on' : ''} style={{ background: bg }} onClick={() => set({ theme: k })} />)}</div>
      </div>
      <div style={{ position: 'sticky', top: 84 }}>
        <div className={'cert t-' + g.theme}>
          <svg className="bgart" viewBox="0 0 40 40"><path d="M20 38V6M20 12l-8-6M20 12l8-6M20 20l-11-8M20 20l11-8M20 29l-13-8M20 29l13-8" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" /></svg>
          <div className="c-top"><div><b>HINOKI</b><small>SPA · Astana</small></div><small style={{ textAlign: 'right' }}>{t.g_cert}<br />{code}</small></div>
          <div className="c-val"><small>{g.to ? `${t.g_for} ${g.to}` : t.g_cert}</small>{valueLabel}{g.type === 'program' && <div style={{ fontFamily: 'var(--sans)', fontSize: 13, opacity: .8, marginTop: 6 }}>{g.guests === 2 ? t.for2 : t.for1} · {prog.dur} {t.min}</div>}</div>
          <div className="c-bot"><div className="c-msg">{g.msg || t.g_msg_ph}{g.from && <div style={{ fontFamily: 'var(--sans)', fontStyle: 'normal', fontSize: 12, marginTop: 4 }}>— {g.from}</div>}</div><div style={{ textAlign: 'right', opacity: .75, fontSize: 11 }}>{t.g_valid}</div></div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '16px 0 10px', gap: 10 }}>
          <span style={{ color: 'var(--muted)' }}>{t.total}</span><b style={{ fontFamily: 'var(--serif)', fontSize: 30 }}>{money(value)}</b>
        </div>
        <a className="btn wa" style={{ width: '100%' }} href={waLink(text)} target="_blank" rel="noopener">🎁 {t.g_order}</a>
      </div>
    </div>
  );
}

          </div>

        </div>
      </div>

const PX = 1.4; // пикселей на минуту
function Timeline({ bookings, date, onOpen, conflicts }) {
  const [hl, setHl] = useState(null);
  const list = bookings.filter(b => b.date === date);
  const H = (CLOSE - OPEN) * PX;
  const isToday = date === todayKey();
  const [nm, setNm] = useState(nowMin());
  useEffect(() => { const i = setInterval(() => setNm(nowMin()), 30000); return () => clearInterval(i); }, []);
  const scrollRef = useRef();
  useEffect(() => { if (isToday && scrollRef.current) scrollRef.current.scrollTop = Math.max(0, (nm - OPEN - 60) * PX); }, [date]);

  const load = r => { const mins = activeOn(bookings, date).flatMap(b => b.segs).filter(s => s.res === r).reduce((a, s) => a + s.to - s.from, 0); return Math.round(mins / (CLOSE - OPEN) * 100); };

  const cols = RESOURCES.map(r => {
    const segs = list.flatMap(b => b.segs.filter(s => s.res === r.id).map(s => ({ ...s, b }))).sort((a, b) => a.from - b.from);
    const lanesEnd = []; segs.forEach(s => { let l = lanesEnd.findIndex(e => e <= s.from); if (l < 0) { l = lanesEnd.length; lanesEnd.push(0); } lanesEnd[l] = s.to; s.lane = l; });
    return { r, segs, lanes: Math.max(1, lanesEnd.length) };
  });
  const colW = c => c.r.kind === 'tea' ? 200 : 168;

  return (
    <div className="tl-wrap">
      <div className="tl-scroll" ref={scrollRef}>
        <div className="tl" style={{ gridTemplateColumns: `52px ${cols.map(c => colW(c) + 'px').join(' ')}`, gridTemplateRows: `auto ${H + 16}px` }}>
          <div className="tl-head tl-corner" />
          {cols.map(c => <div key={c.r.id} className="tl-head">{c.r.name}<small>{c.r.sub}{c.r.kind !== 'tea' && ` · ${load(c.r.id)}%`}</small>{c.r.kind !== 'tea' && <div className="ld"><i style={{ width: load(c.r.id) + '%' }} /></div>}</div>)}
          <div className="tl-hours">
            {Array.from({ length: 14 }, (_, i) => <div key={i} style={{ top: i * 60 * PX + 8 }}>{fmt(OPEN + i * 60)}</div>)}
          </div>
          {cols.map(c => (
            <div key={c.r.id} className={'tl-col' + (c.r.kind === 'tea' ? ' tea' : '')} style={{ paddingTop: 8 }}>
              {Array.from({ length: 26 }, (_, i) => <div key={i} className={'tl-line' + (i % 2 ? ' half' : '')} style={{ top: i * 30 * PX + 8 }} />)}
              {isToday && nm >= OPEN && nm <= CLOSE && <div className="now" style={{ top: (nm - OPEN) * PX + 8 }} />}
              {c.segs.map((s, i) => {
                const b = s.b; const w = 100 / c.lanes; const h = (s.to - s.from) * PX - 2;
                return (
                  <button key={b.id + i} className={`ev k-${s.kind} st-${b.status}${hl === b.id ? ' hl' : ''}${conflicts.has(b.id) && c.r.kind !== 'tea' ? ' conflict' : ''}${b.fresh ? ' fresh' : ''}`}
                    style={{ top: (s.from - OPEN) * PX + 9, height: h, left: `calc(${s.lane * w}% + 3px)`, width: `calc(${w}% - 6px)` }}
                    onMouseEnter={() => setHl(b.id)} onMouseLeave={() => setHl(null)} onClick={() => onOpen(b.id)}
                    title={`${b.name} · ${svcName(b.svc)} · ${fmt(s.from)}–${fmt(s.to)}`}>
                    <span className="t">{fmt(s.from)}–{fmt(s.to)}</span>
                    <b>{b.fresh && '🆕 '}{b.name}</b>
                    {h > 44 && <span style={{ opacity: .8 }}>{svcName(b.svc)}{b.guests === 2 ? ' ×2' : ''}</span>}
                    {h > 30 && <div className="tags">
                      {s.kind === 'massage' && <span className={'tg ' + b.intensity}>{INTENS[b.intensity].tag}</span>}
                      {h > 62 && <span className="tg" style={{ color: ST[b.status].c }}>● {ST[b.status].ru}</span>}
                      {h > 62 && b.comment && s.kind !== 'tea' && <span className="tg" title={b.comment}>⚠︎ заметка</span>}
                    </div>}
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Clients({ clients, bookings, onNote, onOpen }) {
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('ltv');
  const rows = useMemo(() => {
    const map = { ...clients };
    bookings.forEach(b => { if (!map[b.phone]) map[b.phone] = { phone: b.phone, name: b.name, notes: '', history: [] }; });
    return Object.values(map).map(c => {
      const bks = bookings.filter(b => b.phone === c.phone && b.status !== 'cancel');
      const paidB = bks.filter(b => b.status === 'paid');
      const visits = [...c.history.map(h => ({ ...h, paid: true })), ...bks.map(b => ({ date: b.date, svc: b.svc, amount: b.price, paid: b.status === 'paid', id: b.id, start: b.start, status: b.status }))].sort((a, b) => b.date.localeCompare(a.date));
      const ltv = c.history.reduce((a, h) => a + h.amount, 0) + paidB.reduce((a, b) => a + b.price, 0);
      return { ...c, visits, ltv, count: c.history.length + paidB.length, upcoming: bks.filter(b => b.status !== 'paid' && b.date >= todayKey()).length };
    }).filter(c => !q || (c.name + c.phone + c.notes).toLowerCase().includes(q.toLowerCase().replace(/\D/g, '') || q.toLowerCase()))
      .sort((a, b) => sort === 'ltv' ? b.ltv - a.ltv : sort === 'visits' ? b.count - a.count : a.name.localeCompare(b.name));
  }, [clients, bookings, q, sort]);
  const total = rows.reduce((a, c) => a + c.ltv, 0);
  return <>
    <div className="crm-bar">
      <input className="inp" style={{ maxWidth: 340 }} placeholder="🔍 Поиск по имени, телефону, заметке" value={q} onChange={e => setQ(e.target.value)} />
      <div className="seg">{[['ltv', 'По LTV'], ['visits', 'По визитам'], ['name', 'А–Я']].map(([k, l]) => <button key={k} className={sort === k ? 'on' : ''} onClick={() => setSort(k)}>{l}</button>)}</div>
      <span className="pill gold" style={{ marginLeft: 'auto' }}>{rows.length} гостей · LTV {money(total)}</span>
    </div>
    <div className="clients">
      {rows.map(c => (
        <div className="cl" key={c.phone}>
          <div className="cl-h"><div className="ava">{initials(c.name)}</div><div style={{ flex: 1, minWidth: 0 }}><b>{c.name}</b><div style={{ fontSize: 13, color: 'var(--muted)' }}>{phoneFmt(c.phone)}</div></div>
            {c.ltv >= 100000 && <span className="pill gold">VIP</span>}{c.upcoming > 0 && <span className="pill olive">запись</span>}</div>
          <div className="cl-stats"><div><small>LTV</small><b>{money(c.ltv)}</b></div><div><small>Визитов</small><b>{c.count}</b></div><div><small>Ср. чек</small><b>{c.count ? money(c.ltv / c.count) : '—'}</b></div></div>
          <textarea className="inp" style={{ minHeight: 56, fontSize: 13.5 }} placeholder="Заметка: предпочтения, аллергии, любимый мастер…" defaultValue={c.notes} onBlur={e => e.target.value !== c.notes && onNote(c.phone, c.name, e.target.value)} />
          <div className="hist">
            {c.visits.slice(0, 4).map((v, i) => <div key={i} style={v.id ? { cursor: 'pointer' } : null} onClick={() => v.id && onOpen(v.id, v.date)}><span>{dateObj(v.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })} · {svcName(v.svc)}{v.id && !v.paid ? <span style={{ color: 'var(--olive)' }}> · {ST[v.status].ru}</span> : ''}</span><b>{money(v.amount)}</b></div>)}
            {c.visits.length === 0 && <div>Визитов пока нет</div>}
            {c.visits.length > 4 && <div style={{ color: 'var(--muted)' }}>ещё {c.visits.length - 4}…</div>}
          </div>
        </div>
      ))}
    </div>
  </>;
}

  const guests = day.reduce((a, b) => a + b.guests, 0);
  const loads = MASTERS.map(m => ({ m, p: Math.round(day.flatMap(b => b.segs).filter(s => s.res === m).reduce((a, s) => a + s.to - s.from, 0) / (CLOSE - OPEN) * 100) }));
  const avg = Math.round(loads.reduce((a, l) => a + l.p, 0) / loads.length);
  const windows = slotsFor({ svcId: 'tynys', dur: 60, guests: 1, pref: 'any' }, bookings, date).filter(s => s.state === 'free');
  const alerts = computeAlerts(bookings, date);
  const conflicts = conflictIds(bookings, date);
  const open = bookings.find(b => b.id === openId);
  const fresh = bookings.filter(b => b.fresh).length;

  return (
    <div className="crm"><div className="wrap">
      <div className="crm-bar">
        <h2>{tab === 'schedule' ? 'Расписание' : 'База клиентов'}</h2>
        <div className="seg dark"><button className={tab === 'schedule' ? 'on' : ''} onClick={() => setTab('schedule')}>Шахматка</button><button className={tab === 'clients' ? 'on' : ''} onClick={() => setTab('clients')}>Клиенты</button></div>
        {tab === 'schedule' && <>
          <div className="datenav"><button onClick={() => setDate(addDays(date, -1))}>‹</button><span>{date === todayKey() ? 'Сегодня, ' : ''}{dateLabel(date)}</span><button onClick={() => setDate(addDays(date, 1))}>›</button></div>
          {date !== todayKey() && <button className="btn ghost sm" onClick={() => setDate(todayKey())}>Сегодня</button>}
          <button className="btn olive sm" onClick={() => setAdding(true)}>+ Запись</button>
        </>}
        <button className="btn ghost sm" title={email} onClick={onLogout}>Выйти</button>
      </div>

      {tab === 'schedule' ? <>
        <div className="kpis">
          <div className="kpi"><small>Выручка (оплачено)</small><b>{money(paid)}</b><div className="sub">ожидается ещё {money(expected)}</div></div>
          <div className="kpi"><small>Записей</small><b>{day.length}</b><div className="sub">{guests} гостей · {all.length - day.length} отмен{fresh ? ` · 🆕 ${fresh} новых` : ''}</div></div>
          <div className="kpi"><small>Загрузка мастеров</small><b>{avg}%</b>
            <div className="loadbars">{loads.map(l => <div key={l.m}><span>{RESOURCES.find(r => r.id === l.m).name.replace('Мастер ', '')}</span><span className="tr"><i style={{ width: l.p + '%', background: l.p > 70 ? 'var(--red)' : l.p > 45 ? 'var(--gold)' : 'var(--olive)' }} /></span><b>{l.p}%</b></div>)}</div></div>
          <div className="kpi"><small>Свободные окна</small><b>{windows.length}</b><div className="sub">для программы 2 ч: {windows.slice(0, 5).map(w => fmt(w.m)).join(', ') || 'нет'}{windows.length > 5 ? '…' : ''}</div></div>
        </div>
        <div className="alerts">
          {alerts.length === 0 && <div className="alert ok"><span className="ic">✓</span><span>Узких мест нет: хаммам и чайная комната без пересечений.</span></div>}
          {alerts.map(a => <div key={a.key} className={'alert ' + a.type} style={a.ids ? { cursor: 'pointer' } : null} onClick={() => a.ids && setOpenId(a.ids[1])}><span className="ic">{a.type === 'red' ? '⚠️' : '☕'}</span>{a.text}</div>)}
        </div>
        <Timeline bookings={bookings} date={date} onOpen={setOpenId} conflicts={conflicts} />
        <div className="legend" style={{ marginTop: 12 }}>
          {Object.entries(PHASE).map(([k, p]) => <span key={k}><i style={{ background: p.c, borderColor: p.c }} />{p.ru}</span>)}
          <span><i style={{ borderColor: 'var(--red)', borderWidth: 2 }} />накладка</span>
          <span style={{ marginLeft: 'auto' }}>{all.some(b => b.seed)
            ? <button className="more" style={{ color: 'var(--muted)' }} onClick={() => { if (confirm('Убрать демо-записи с этого дня? Настоящие записи останутся.')) onClearDemo(date); }}>Убрать демо-записи</button>
            : <button className="more" onClick={() => onDemo(date)}>Заполнить день демо-записями</button>}</span>
        </div>
      </> : <Clients clients={clients} bookings={bookings} onNote={onNote} onOpen={(id, d) => { setTab('schedule'); setDate(d); setOpenId(id); }} />}

      {open && <BookingDrawer b={open} client={clients[open.phone]} onClose={() => setOpenId(null)} onUpdate={onUpdate} onDelete={id => { onDelete(id); setOpenId(null); }} />}
      {adding && <AdminNewBooking bookings={bookings} date={date} onCreate={onCreate} onClose={() => setAdding(false)} />}
    </div></div>
  );
}

/* ================= ВХОД И ДАННЫЕ CRM ================= */
function useAdmin() {
  const [session, setSession] = useState(undefined);
  const [isAdmin, setIsAdmin] = useState(null);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);
  const uidKey = session && session.user ? session.user.id : null;
  useEffect(() => { setIsAdmin(null); if (uidKey) sb.rpc('is_admin').then(({ data }) => setIsAdmin(!!data)); }, [uidKey]);
  return { session, isAdmin };
}

function Login() {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const go = async e => {
    e.preventDefault(); setBusy(true); setErr('');
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(/invalid/i.test(error.message) ? 'Неверный email или пароль' : error.message);
  };
  return (
    <div className="crm"><div className="wrap" style={{ maxWidth: 440 }}>
      <form className="panel" onSubmit={go} style={{ marginTop: 30 }}>
        <Leaf size={46} />
        <h2 style={{ fontSize: 36, margin: '12px 0 4px' }}>Вход в CRM</h2>
        <p style={{ color: 'var(--muted)', margin: '0 0 8px', fontSize: 14 }}>Только для администраторов Hinoki SPA</p>
        <span className="lbl">Email</span>
        <input className="inp" type="email" autoComplete="username" value={email} onChange={e => setEmail(e.target.value)} required />
        <span className="lbl">Пароль</span>
        <input className="inp" type="password" autoComplete="current-password" value={pw} onChange={e => setPw(e.target.value)} required />
        {err && <p className="err">{err}</p>}
        <button className="btn olive" style={{ width: '100%', marginTop: 18 }} disabled={busy}>{busy ? 'Входим…' : 'Войти'}</button>
      </form>
    </div></div>
  );
}

function CrmContainer({ session, onToast, focus }) {
  const [bookings, setBookings] = useState(null);
  const [clients, setClients] = useState({});
  const [err, setErr] = useState('');
  const load = useCallback(async () => {
    const from = addDays(todayKey(), -180), to = addDays(todayKey(), 90);
    const [b, c] = await Promise.all([
      sb.from('bookings').select('*').gte('date', from).lte('date', to).order('start'),
      sb.from('clients').select('*'),
    ]);
    if (b.error || c.error) { setErr((b.error || c.error).message); return; }
    setErr('');
    setBookings(b.data.map(fromDb));
    setClients(Object.fromEntries(c.data.map(x => [x.phone, x])));
  }, []);
  useEffect(() => {
    load();
    let tmr;
    const later = () => { clearTimeout(tmr); tmr = setTimeout(load, 300); };
    const ch = sb.channel('crm-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, p => { if (p.eventType === 'INSERT' && (p.new.source || '').startsWith('Онлайн')) onToast(p.new); later(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'clients' }, later)
      .subscribe();
    const iv = setInterval(load, 60000);
    return () => { sb.removeChannel(ch); clearInterval(iv); clearTimeout(tmr); };
  }, []);
  const run = async q => { const { error } = await q; if (error) { alert('Ошибка сервера: ' + error.message); load(); } };
  const update = (id, patch) => { setBookings(bs => bs.map(b => b.id === id ? { ...b, ...patch } : b)); run(sb.from('bookings').update(patch).eq('id', id)); };
  const del = id => { setBookings(bs => bs.filter(b => b.id !== id)); run(sb.from('bookings').delete().eq('id', id)); };
  const create = async b => {
    setBookings(bs => [...bs, b]);
    await run(sb.from('bookings').insert(toDb(b)));
    await sb.from('clients').upsert({ phone: b.phone, name: b.name }, { onConflict: 'phone', ignoreDuplicates: true });
    load();
  };
  const note = (phone, name, notes) => { setClients(c => ({ ...c, [phone]: { phone, name, history: [], ...(c[phone] || {}), notes } })); run(sb.from('clients').upsert({ phone, name, notes }, { onConflict: 'phone' })); };
  const demo = async date => {
    await run(sb.from('bookings').upsert(seedBookings(date).map(toDb), { onConflict: 'id', ignoreDuplicates: true }));
    await sb.from('clients').upsert(Object.values(seedClients(date)), { onConflict: 'phone', ignoreDuplicates: true });
    load();
  };
  const clearDemo = async date => { await run(sb.from('bookings').delete().eq('date', date).eq('seed', true)); load(); };
  const logout = () => sb.auth.signOut();
  if (err) return <div className="crm"><div className="wrap"><div className="alert red"><span className="ic">⚠️</span><span>Не удалось загрузить данные: {err} <button className="btn ghost sm" onClick={load}>Повторить</button></span></div></div></div>;
  if (!bookings) return <div className="boot">Загружаем CRM…</div>;
  return <CRM bookings={bookings} clients={clients} onUpdate={update} onDelete={del} onCreate={create} onNote={note} onDemo={demo} onClearDemo={clearDemo} onLogout={logout} email={session.user.email} focus={focus} />;
}

/* ================= ПРИЛОЖЕНИЕ ================= */
function App() {
  const isAdminHash = () => location.hash === '#admin';
  const [mode, setMode] = useState(() => (isAdminHash() ? 'crm' : 'site'));
  useEffect(() => { const h = () => setMode(isAdminHash() ? 'crm' : 'site'); addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
  const [lang, setLang] = useState(() => store.get('hinoki-lang') || 'ru');
  const [toast, setToast] = useState(null);
  const [focus, setFocus] = useState(null);
  const { session, isAdmin } = useAdmin();
  const t = T[lang];

  useEffect(() => { store.set('hinoki-lang', lang); document.documentElement.lang = lang === 'kz' ? 'kk' : 'ru'; }, [lang]);
  useEffect(() => { window.scrollTo(0, 0); document.title = mode === 'crm' ? 'Hinoki CRM' : 'Hinoki SPA — Астана · онлайн-запись'; }, [mode]);
  useEffect(() => { if (!toast) return; const i = setTimeout(() => setToast(null), 8000); return () => clearTimeout(i); }, [toast]);
  const onToast = useCallback(b => setToast({ text: `Новая онлайн-запись: ${b.name} · ${svcName(b.svc)} · ${dateLabel(b.date)} ${fmt(b.start)}`, b }), []);

  let crmView;
  if (session === undefined || (session && isAdmin === null)) crmView = <div className="boot">Hinoki CRM…</div>;
  else if (!session) crmView = <Login />;
  else if (!isAdmin) crmView = <div className="crm"><div className="wrap" style={{ maxWidth: 460 }}><div className="panel"><h2 style={{ fontSize: 30 }}>Нет доступа</h2><p style={{ color: 'var(--wood-2)' }}>Аккаунт {session.user.email} не является администратором салона.</p><button className="btn ghost" onClick={() => sb.auth.signOut()}>Выйти</button></div></div></div>;
  else crmView = <CrmContainer session={session} onToast={onToast} focus={focus} />;

  return <>
    <header className="top">
      <div className="wrap">
        <a className="logo" href={location.pathname} onClick={e => { if (mode === 'site') { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }}>
          <Leaf /><div><b>Hinoki</b><small>SPA · Astana</small></div>
        </a>
        {mode === 'site' && <nav className="nav"><a href="#services">{t.nav_services}</a><a href="#book">{t.nav_book}</a><a href="#gift">{t.nav_gift}</a><a href="#contacts">{t.nav_contacts}</a></nav>}
        <div className="sp" />
        {mode === 'site' && <div className="seg"><button className={lang === 'ru' ? 'on' : ''} onClick={() => setLang('ru')}>RU</button><button className={lang === 'kz' ? 'on' : ''} onClick={() => setLang('kz')}>KZ</button></div>}
        {mode === 'crm' && <a className="btn ghost sm" href={location.pathname}>← На сайт</a>}
      </div>
    </header>
    {mode === 'site' ? <ClientSite lang={lang} t={t} /> : crmView}
    {toast && mode === 'crm' && <div className="toast"><span>🆕 {toast.text}</span><button onClick={() => { setFocus({ id: toast.b.id, date: toast.b.date, n: Date.now() }); setToast(null); }}>Открыть</button></div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<noscript>Для работы сайта включите JavaScript.</noscript>
</body>
